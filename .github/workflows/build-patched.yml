name: Build Patched APK (F-Droid)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/save-to-gallery-android16

jobs:
  build:
    name: Build F-Droid APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up NDK r21e
        uses: nttld/setup-ndk@v1.4.2
        id: ndk-r21e
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Set up NDK r23c
        uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;23.2.8568313" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2.4988404"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build \
            golang-go \
            yasm \
            cmake \
            libuv1 \
            make \
            meson \
            gperf \
            g++

      - name: Apply F-Droid prebuild recipe
        run: |
          sed -i -e '/JavaVersion/s/17/21/' TMessagesProj/build.gradle TMessagesProj_App/build.gradle
          sed -i -e '/play/d' TMessagesProj/build.gradle
          sed -i -e '/gms/d' TMessagesProj/src/main/java/org/telegram/messenger/CaptchaController.java
          ./prebuild_fdroid.sh 0 14577864 54d3ae230fd8f985ce9adccf08fbd9d6
          sed -i -e '6 s/"$(ANDROID_SDK)"/$ANDROID_SDK/g' TMessagesProj/jni/build_boringssl.sh
          sed -i -e 's/${cmakePath}cmake/$cmakePath/g' TMessagesProj/jni/build_boringssl.sh
          sed -i -e '9 s/.$//' TMessagesProj/jni/build_boringssl.sh
          sed -i -e 's/ANDROID_API=16/ANDROID_API=21/g' TMessagesProj/jni/build_dav1d_clang.sh TMessagesProj/jni/build_ffmpeg_clang.sh
          sed -i -e 's/API=16/API=21/g' TMessagesProj/jni/build_boringssl.sh
          sed -i -e 's|${TOOLS_PREFIX}ld|${LLVM_BIN}/ld.lld|g' \
                 -e 's|${TOOLS_PREFIX}ar|${LLVM_BIN}/llvm-ar|g' \
                 -e 's|${TOOLS_PREFIX}strip|${LLVM_BIN}/llvm-strip|g' \
                 -e 's|${TOOLS_PREFIX}nm|${LLVM_BIN}/llvm-nm|g' \
                 -e 's|${TOOLS_PREFIX}ranlib|${LLVM_BIN}/llvm-ranlib|g' \
                 TMessagesProj/jni/build_dav1d_clang.sh \
                 TMessagesProj/jni/build_libvpx_clang.sh \
                 TMessagesProj/jni/build_ffmpeg_clang.sh
          sed -i -e 's|CROSS_PREFIX=${PREBUILT}/bin/${ARCH_NAME}-linux-${BIN_MIDDLE}-|CROSS_PREFIX=${LLVM_BIN}/llvm-|g' \
                 TMessagesProj/jni/build_dav1d_clang.sh \
                 TMessagesProj/jni/build_libvpx_clang.sh \
                 TMessagesProj/jni/build_ffmpeg_clang.sh
          sed -i -e '/export ISYSTEM=/d' \
                 -e '/--libc=/d' \
                 -e 's/-std=c++11/-std=c++17/g' \
                 TMessagesProj/jni/build_libvpx_clang.sh
          sed -i -e 's|git checkout -- tde2e/|& \&\& sed -i -e "s/23.2.8568313/27.2.12479018/g" -e "s/android-16/android-21/g" tde2e/build-tdlib.sh|' \
                 TMessagesProj/jni/prepare.py
          rm -rf TMessagesProj_AppHuawei

      - name: Build native dependencies upfront
        env:
          NDK: ${{ steps.ndk-r21e.outputs.ndk-path }}
          NINJA_PATH: /usr/bin/ninja
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          cd TMessagesProj/jni
          ./build_dav1d_clang.sh arm64
          ./build_libvpx_clang.sh arm64
          ./build_ffmpeg_clang.sh arm64
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Build APK (arm64-v8a)
        env:
          NDK: ${{ steps.ndk-r21e.outputs.ndk-path }}
          NINJA_PATH: /usr/bin/ninja
          NATIVE_DEPS_NDK_DIR: ${{ steps.ndk-r21e.outputs.ndk-path }}
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          ./gradlew :TMessagesProj_App:assembleAfatFd_v8aRelease -x :TMessagesProj:buildNativeDeps --no-daemon

      - name: Locate and rename APK
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2 | tr -d ' ')
          DEST="forkgram-${VERSION}-arm64-patched-save-gallery.apk"
          cp "$APK" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forkgram-patched
          path: ${{ env.APK_PATH }}
          retention-days: 30
